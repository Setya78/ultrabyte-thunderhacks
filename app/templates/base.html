<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UltraByte{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon-v1.svg">
</head>
<body>
  <div class="synthetic-banner" role="note">SYNTHETIC DATA &middot; no real players, transactions or sponsor data</div>
  <header class="top">
    <a class="brand" href="/"><img src="/static/brand/logo-v1.svg" alt="UltraByte" height="44"></a>
    <span class="tagline">Rules tell you what happened. UltraByte tells you why it matters.</span>
    <nav class="nav"><a href="/">Queue</a><a href="/dashboard">Dashboard</a><a href="/network">Network</a><a href="/validation">Validation</a><a href="/audit">Audit trail</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="foot">v{{ version }} &middot; LLM {{ "on" if llm_enabled else "off" }} &middot; built during ThunderHacks II</footer>
</body>
</html>
